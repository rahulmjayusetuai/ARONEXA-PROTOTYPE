<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Highlights: body map, scan comparison, explanations in English and Malayalam, and a live queue.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,'Noto Sans Malayalam',sans-serif}
.card{opacity:0;animation:up .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.ring{fill:#14b8a6;fill-opacity:.35;transform-box:fill-box;transform-origin:center;animation:ripple 2.4s ease-out infinite}
@keyframes ripple{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.5);opacity:0}}
.dot{fill:#14b8a6;stroke:#c7ffeb;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.25)}}
.sweepmask{animation:wipe 5s ease-in-out infinite alternate}
@keyframes wipe{from{clip-path:inset(0 85% 0 0)}to{clip-path:inset(0 15% 0 0)}}
.slider{animation:slide 5s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(34.8px)}to{transform:translateX(197.2px)}}
.lang{opacity:0}.lang.a{animation:a 6s infinite}.lang.b{animation:b 6s infinite}
@keyframes a{0%,42%{opacity:1}50%,92%{opacity:0}100%{opacity:1}}
@keyframes b{0%,42%{opacity:0}50%,92%{opacity:1}100%{opacity:0}}
.bar{transform-box:fill-box;transform-origin:center;animation:eq 1.1s ease-in-out infinite alternate}
@keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.tok{opacity:0}.t1{animation:t1 7.5s infinite}.t2{animation:t2 7.5s infinite}.t3{animation:t3 7.5s infinite}
@keyframes t1{0%,28%{opacity:1}33%,95%{opacity:0}100%{opacity:1}}
@keyframes t2{0%,28%{opacity:0}33%,61%{opacity:1}66%,100%{opacity:0}}
@keyframes t3{0%,61%{opacity:0}66%,95%{opacity:1}100%{opacity:0}}
.prog{transform-box:fill-box;transform-origin:left;animation:prog 7.5s ease-in-out infinite}
@keyframes prog{0%{transform:scaleX(.08)}33%{transform:scaleX(.38)}66%{transform:scaleX(.68)}96%,100%{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.card,.lang.a,.t3{opacity:1}}
</style>
<g class="card" style="animation-delay:0.0s"><g transform="translate(8 8)"><rect width="284" height="244" rx="18" fill="#fff" stroke="#e2e8f0"/><g transform="translate(26 22)"><rect width="232" height="124" rx="14" fill="#031c54"/><path d="M116 16v92M116 62h-34M116 62h34M116 26v0" stroke="#14b8a6" stroke-width="2" stroke-dasharray="4 5" opacity=".7"/><g transform="translate(116 26)"><circle r="17" class="ring" style="animation-delay:0s"/><circle r="8" class="dot" style="animation-delay:0s"/></g><g transform="translate(82 62)"><circle r="17" class="ring" style="animation-delay:0.6s"/><circle r="8" class="dot" style="animation-delay:0.6s"/></g><g transform="translate(150 62)"><circle r="17" class="ring" style="animation-delay:1.2s"/><circle r="8" class="dot" style="animation-delay:1.2s"/></g><g transform="translate(116 98)"><circle r="17" class="ring" style="animation-delay:1.8s"/><circle r="8" class="dot" style="animation-delay:1.8s"/></g></g><text x="26" y="184" font-size="19" font-weight="700" fill="#031c54">Body map</text><text x="26" y="213" font-size="14" fill="#64748b">Click an organ, see its reports</text></g></g><g class="card" style="animation-delay:0.12s"><g transform="translate(308 8)"><rect width="284" height="244" rx="18" fill="#fff" stroke="#e2e8f0"/><g transform="translate(26 22)"><clipPath id="c2"><rect width="232" height="124" rx="14"/></clipPath><g clip-path="url(#c2)"><rect width="232" height="124" fill="#031c54"/><g fill="none" stroke="#64748b" stroke-width="3"><ellipse cx="116" cy="62" rx="58" ry="40"/><ellipse cx="116" cy="62" rx="32" ry="20"/></g><g class="sweepmask"><rect width="232" height="124" fill="#0b7f78"/><g fill="none" stroke="#c7ffeb" stroke-width="3"><ellipse cx="116" cy="62" rx="58" ry="40"/><ellipse cx="116" cy="62" rx="24" ry="14"/></g></g><g class="slider"><rect x="-1.5" width="3" height="124" fill="#fff"/><circle cy="62" r="11" fill="#fff"/><path d="M-4 57l-5 5 5 5M4 57l5 5-5 5" fill="none" stroke="#031c54" stroke-width="2"/></g></g></g><text x="26" y="184" font-size="19" font-weight="700" fill="#031c54">Compare scans</text><text x="26" y="213" font-size="14" fill="#64748b">Old and new, side by side</text></g></g><g class="card" style="animation-delay:0.24s"><g transform="translate(608 8)"><rect width="284" height="244" rx="18" fill="#fff" stroke="#e2e8f0"/><g transform="translate(26 22)"><rect width="232" height="124" rx="14" fill="#031c54"/><text class="lang a" x="116" y="56" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Your heart is normal</text><text class="lang b" x="116" y="56" text-anchor="middle" font-size="21" font-weight="700" fill="#c7ffeb">ഹൃദയം സാധാരണമാണ്</text><g transform="translate(66 76)" fill="#14b8a6"><rect class="bar" style="animation-delay:0.0s" x="0" y="0" width="6" height="26" rx="3"/><rect class="bar" style="animation-delay:0.11s" x="11" y="0" width="6" height="26" rx="3"/><rect class="bar" style="animation-delay:0.22s" x="22" y="0" width="6" height="26" rx="3"/><rect class="bar" style="animation-delay:0.33s" x="33" y="0" width="6" height="26" rx="3"/><rect class="bar" style="animation-delay:0.44s" x="44" y="0" width="6" height="26" rx="3"/><rect class="bar" style="animation-delay:0.55s" x="55" y="0" width="6" height="26" rx="3"/><rect class="bar" style="animation-delay:0.66s" x="66" y="0" width="6" height="26" rx="3"/><rect class="bar" style="animation-delay:0.77s" x="77" y="0" width="6" height="26" rx="3"/><rect class="bar" style="animation-delay:0.88s" x="88" y="0" width="6" height="26" rx="3"/><rect class="bar" style="animation-delay:0.99s" x="99" y="0" width="6" height="26" rx="3"/></g></g><text x="26" y="184" font-size="19" font-weight="700" fill="#031c54">Explain results</text><text x="26" y="213" font-size="14" fill="#64748b">In English and Malayalam</text></g></g><g class="card" style="animation-delay:0.36s"><g transform="translate(908 8)"><rect width="284" height="244" rx="18" fill="#fff" stroke="#e2e8f0"/><g transform="translate(26 22)"><rect width="232" height="124" rx="14" fill="#031c54"/><text x="20" y="32" font-size="12" fill="#cbd5e1">NOW SERVING</text><text class="tok t1" x="20" y="84" font-size="44" font-weight="800" fill="#fff">T-02</text><text class="tok t2" x="20" y="84" font-size="44" font-weight="800" fill="#fff">T-03</text><text class="tok t3" x="20" y="84" font-size="44" font-weight="800" fill="#c7ffeb">T-04</text><rect x="20" y="100" width="192" height="6" rx="3" fill="#fff" fill-opacity=".18"/><rect class="prog" x="20" y="100" width="192" height="6" rx="3" fill="#14b8a6"/></g><text x="26" y="184" font-size="19" font-weight="700" fill="#031c54">Live queue</text><text x="26" y="213" font-size="14" fill="#64748b">Follow your turn on the day</text></g></g>
</svg>