<path class="pulse" pathLength="1" d="M0 352 h52 l8 -8 l8 8 h8 l5 6 l9 -62 l9 80 l7 -24 h12 c5 -14 12 -14 17 0 h15 h52 l8 -8 l8 8 h8 l5 6 l9 -62 l9 80 l7 -24 h12 c5 -14 12 -14 17 0 h15 h52 l8 -8 l8 8 h8 l5 6 l9 -62 l9 80 l7 -24 h12 c5 -14 12 -14 17 0 h15 h52 l8 -8 l8 8 h8 l5 6 l9 -62 l9 80 l7 -24 h12 c5 -14 12 -14 17 0 h15 h52 l8 -8 l8 8 h8 l5 6 l9 -62 l9 80 l7 -24 h12 c5 -14 12 -14 17 0 h15 h52 l8 -8 l8 8 h8 l5 6 l9 -62 l9 80 l7 -24 h12 c5 -14 12 -14 17 0 h15 h52 l8 -8 l8 8 h8 l5 6 l9 -62 l9 80 l7 -24 h12 c5 -14 12 -14 17 0 h15 h52 l8 -8 l8 8 h8 l5 6 l9 -62 l9 80 l7 -24 h12 c5 -14 12 -14 17 0 h15 h52 l8 -8 l8 8 h8 l5 6 l9 -62 l9 80 l7 -24 h12 c5 -14 12 -14 17 0 h15"/>
<line x1="950" y1="205" x2="930" y2="92" class="spoke" style="animation-delay:0s"/><line x1="950" y1="205" x2="1046" y2="134" class="spoke" style="animation-delay:0.5s"/><line x1="950" y1="205" x2="1090" y2="240" class="spoke" style="animation-delay:1s"/><line x1="950" y1="205" x2="1012" y2="322" class="spoke" style="animation-delay:1.5s"/><line x1="950" y1="205" x2="868" y2="300" class="spoke" style="animation-delay:2s"/><line x1="950" y1="205" x2="806" y2="190" class="spoke" style="animation-delay:2.5s"/><g transform="translate(930 92)"><circle r="24" class="ring" style="animation-delay:0s"/><circle r="11" class="dot" style="animation-delay:0s"/></g><g transform="translate(1046 134)"><circle r="24" class="ring" style="animation-delay:0.5s"/><circle r="11" class="dot" style="animation-delay:0.5s"/></g><g transform="translate(1090 240)"><circle r="24" class="ring" style="animation-delay:1s"/><circle r="11" class="dot" style="animation-delay:1s"/></g><g transform="translate(1012 322)"><circle r="24" class="ring" style="animation-delay:1.5s"/><circle r="11" class="dot" style="animation-delay:1.5s"/></g><g transform="translate(868 300)"><circle r="24" class="ring" style="animation-delay:2s"/><circle r="11" class="dot" style="animation-delay:2s"/></g><g transform="translate(806 190)"><circle r="24" class="ring" style="animation-delay:2.5s"/><circle r="11" class="dot" style="animation-delay:2.5s"/></g>
