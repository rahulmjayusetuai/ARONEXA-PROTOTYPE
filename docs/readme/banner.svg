<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="AroNexa. See every patient's full story. Explain it in their language.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,'Noto Sans Malayalam',sans-serif}
.up{opacity:0;animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.base{fill:none;stroke:#14b8a6;stroke-opacity:.16;stroke-width:2}
.pulse{fill:none;stroke:#c7ffeb;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:.16 .84;animation:run 5s linear infinite}
@keyframes run{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.spoke{stroke:#14b8a6;stroke-width:1.6;stroke-dasharray:5 7;stroke-opacity:.55;animation:flow 3s linear infinite}
@keyframes flow{to{stroke-dashoffset:-48}}
.ring{fill:#14b8a6;fill-opacity:.18;transform-box:fill-box;transform-origin:center;animation:ripple 3s ease-out infinite}
@keyframes ripple{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.dot{fill:#14b8a6;stroke:#c7ffeb;stroke-width:2.5;transform-box:fill-box;transform-origin:center;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.25)}}
.heart{transform-box:fill-box;transform-origin:center;animation:beat 1.5s ease-in-out infinite}
@keyframes beat{0%,40%,100%{transform:scale(1)}12%{transform:scale(1.13)}26%{transform:scale(1.05)}}
.halo{transform-box:fill-box;transform-origin:center;animation:halo 1.5s ease-out infinite}
@keyframes halo{from{transform:scale(.7);opacity:.55}to{transform:scale(1.35);opacity:0}}
.glow{transform-box:fill-box;transform-origin:center;animation:drift 12s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-70px,36px) scale(1.2)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.up{opacity:1}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#031c54"/><stop offset=".45" stop-color="#031c54"/><stop offset="1" stop-color="#062c6e"/></linearGradient>
<radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#14b8a6" stop-opacity=".42"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>
<linearGradient id="h" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c7ffeb"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
<clipPath id="r"><rect width="1200" height="420" rx="24"/></clipPath>
</defs>
<g clip-path="url(#r)">
<rect width="1200" height="420" fill="url(#bg)"/>
<circle class="glow" cx="950" cy="190" r="330" fill="url(#g)"/>
