<text class="up" style="animation-delay:.45s" x="60" y="228" font-size="46" font-weight="700" fill="#c7ffeb">Explain it in their language.</text>
<text class="up" style="animation-delay:.7s" x="60" y="274" font-size="21" fill="#cbd5e1">Connected doctor and patient apps, in English and Malayalam.</text>
</g>
